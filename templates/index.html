{% extends 'base.html' %}
{% block content %}
    <h1 class="mb-4">Items</h1>
    <a href="{{ url_for('create') }}" class="btn btn-primary mb-3">Add new item</a>

    <ul class="list-group">
        {% for item in items %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ item.name }}</span>
                <div>
                    <a href="{{ url_for('update', idNum=item.idNum) }}" class="btn btn-sm btn-outline-secondary me-2">Edit</a>
                    <form action="{{ url_for('delete', idNum=item.idNum) }}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </li>
        {% else %}
            <li class="list-group-item">No items yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
